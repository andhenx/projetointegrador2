<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimentações — SmartFerragem</title>
  <link rel="shortcut icon" type="image/png" href="./assets/images/logos/favicon.png">
  <link rel="stylesheet" href="./assets/css/styles.min.css?v=2">
  <link rel="stylesheet" href="./assets/css/smartferragem.css?v=2">
  <style>
    /* toggle Entrada / Saída — específico desta página */
    .sf-tipo-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sf-tipo-btn {
      padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: none; color: var(--t2); font-size: 13px; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: all var(--t);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sf-tipo-btn:hover { background: rgba(255,255,255,0.05); }
    .sf-tipo-btn.entrada.active { background: rgba(52,211,153,0.12); border-color: var(--green); color: var(--green); }
    .sf-tipo-btn.saida.active   { background: rgba(248,113,113,0.12); border-color: var(--red);   color: var(--red); }

    /* tags coloridas de entrada/saída na tabela */
    .sf-tag.entrada { background: rgba(52,211,153,0.12); color: var(--green); }
    .sf-tag.saida   { background: rgba(248,113,113,0.12); color: var(--red); }

    /* largura do modal nesta página é menor */
    #sf-modal .sf-modal { max-width: 460px; }
  </style>
</head>
<body>

<div class="sf-sidebar-backdrop" id="sf-backdrop"></div>

<!-- ── Sidebar ─────────────────────────────────────────────── -->
<aside class="left-sidebar" id="sf-sidebar">
  <button class="sf-sidebar-close" id="sf-close"><i class="ti ti-x"></i></button>

  <div class="sf-brand">
    <div class="sf-brand-logo">
      <div class="sf-brand-icon"><i class="ti ti-bolt"></i></div>
      <div>
        <div class="sf-brand-name">SmartFerragem</div>
        <div class="sf-brand-sub">Controle de Estoque</div>
      </div>
    </div>
  </div>

  <nav>
    <ul style="list-style:none;margin:0;padding:0;">
      <li class="sf-nav-item">
        <a class="sf-nav-link" href="./index.html">
          <i class="ti ti-layout-dashboard"></i> Dashboard
        </a>
      </li>
      <li class="sf-nav-item">
        <a class="sf-nav-link" href="./produtos.html">
          <i class="ti ti-package"></i> Estoque
        </a>
      </li>
      <li class="sf-nav-item">
        <a class="sf-nav-link active" href="./movimentacoes.html">
          <i class="ti ti-arrows-exchange"></i> Movimentações
        </a>
      </li>
    </ul>
  </nav>
</aside>

<!-- ── Header ──────────────────────────────────────────────── -->
<header class="sf-header">
  <button class="sf-header-mobile-toggle" id="sf-menu-toggle">
    <i class="ti ti-menu-2"></i>
  </button>
  <span class="sf-header-title">Movimentações</span>
  <div class="sf-header-spacer"></div>
  <button class="sf-cmd-trigger" id="sf-cmd-open">
    <i class="ti ti-search" style="font-size:14px"></i>
    <span>Busca rápida...</span>
    <kbd>Ctrl K</kbd>
  </button>
</header>

<!-- ── Main ────────────────────────────────────────────────── -->
<main class="sf-main">
  <div class="sf-content">

    <div class="sf-page-header">
      <div>
        <h1 class="sf-page-title">Movimentações</h1>
        <p class="sf-page-sub">Entradas e saídas de estoque</p>
      </div>
      <div style="display:flex;gap:10px">
        <button class="sf-refresh-btn" id="sf-refresh">
          <i class="ti ti-refresh"></i> Atualizar
        </button>
        <button class="sf-btn-new" id="sf-btn-new">
          <i class="ti ti-plus"></i> Nova Movimentação
        </button>
      </div>
    </div>

    <!-- Error -->
    <div class="sf-error" id="sf-error" style="display:none">
      <i class="ti ti-alert-circle"></i>
      <span id="sf-error-msg"></span>
    </div>

    <div class="sf-card">
      <!-- Toolbar -->
      <div class="sf-toolbar">
        <div class="sf-search">
          <i class="ti ti-search"></i>
          <input type="text" id="sf-search" placeholder="Buscar por código ou descrição...">
        </div>
        <div class="sf-filter-group">
          <button class="sf-filter-btn active" data-f="todos">Todos</button>
          <button class="sf-filter-btn" data-f="Entrada">
            <i class="ti ti-arrow-bar-to-down"></i> Entrada
          </button>
          <button class="sf-filter-btn" data-f="Saida">
            <i class="ti ti-arrow-bar-up"></i> Saída
          </button>
        </div>
      </div>

      <!-- Skeleton -->
      <div id="sf-skeleton">
        <div class="sf-skeleton-row"><div class="sf-skeleton" style="width:100%;height:13px"></div></div>
        <div class="sf-skeleton-row"><div class="sf-skeleton" style="width:88%;height:13px"></div></div>
        <div class="sf-skeleton-row"><div class="sf-skeleton" style="width:94%;height:13px"></div></div>
        <div class="sf-skeleton-row"><div class="sf-skeleton" style="width:78%;height:13px"></div></div>
        <div class="sf-skeleton-row"><div class="sf-skeleton" style="width:91%;height:13px"></div></div>
      </div>

      <!-- Table -->
      <div class="sf-table-wrap" id="sf-table-wrap" style="display:none">
        <table class="sf-table">
          <thead>
            <tr>
              <th>Data</th>
              <th class="col-center">Tipo</th>
              <th>Código</th>
              <th>Descrição</th>
              <th class="col-num">Qtde</th>
              <th class="col-num">Preço Unit.</th>
              <th class="col-num">Total</th>
            </tr>
          </thead>
          <tbody id="sf-tbody"></tbody>
        </table>
      </div>

      <div class="sf-count" id="sf-count" style="display:none"></div>
    </div>

  </div>
</main>

<!-- ── Modal Nova Movimentação ──────────────────────────────── -->
<div class="sf-modal-overlay" id="sf-modal">
  <div class="sf-modal">
    <div class="sf-modal-header">
      <h3 class="sf-modal-title">Nova Movimentação</h3>
      <button class="sf-modal-close" id="sf-modal-close"><i class="ti ti-x"></i></button>
    </div>
    <div class="sf-modal-body">

      <div class="sf-field">
        <label class="sf-label">Tipo *</label>
        <div class="sf-tipo-toggle">
          <button class="sf-tipo-btn entrada active" data-tipo="Entrada">
            <i class="ti ti-arrow-bar-to-down"></i> Entrada
          </button>
          <button class="sf-tipo-btn saida" data-tipo="Saida">
            <i class="ti ti-arrow-bar-up"></i> Saída
          </button>
        </div>
      </div>

      <div class="sf-field">
        <label class="sf-label">Produto *</label>
        <select class="sf-select" id="f-produto">
          <option value="">Selecione um produto...</option>
        </select>
      </div>

      <div class="sf-input-row">
        <div class="sf-field" style="margin-bottom:0">
          <label class="sf-label">Quantidade *</label>
          <input class="sf-input" type="number" id="f-qtde" placeholder="0" min="0.001" step="1">
        </div>
        <div class="sf-field" style="margin-bottom:0">
          <label class="sf-label">Preço Unitário (R$)</label>
          <input class="sf-input" type="number" id="f-preco" placeholder="0,00" min="0" step="0.01">
        </div>
      </div>

    </div>
    <div class="sf-modal-footer">
      <button class="sf-btn sf-btn-ghost" id="sf-modal-cancel">Cancelar</button>
      <button class="sf-btn sf-btn-primary" id="sf-modal-save">
        <i class="ti ti-check" style="font-size:14px;margin-right:4px"></i>Registrar
      </button>
    </div>
  </div>
</div>

<!-- ── Command Palette ─────────────────────────────────────── -->
<div class="sf-cmd-overlay" id="sf-cmd">
  <div class="sf-cmd-box">
    <div class="sf-cmd-search">
      <i class="ti ti-search"></i>
      <input type="text" id="sf-cmd-input" placeholder="Buscar produtos, páginas..." autocomplete="off" spellcheck="false">
      <span class="sf-cmd-esc">ESC</span>
    </div>
    <div class="sf-cmd-results" id="sf-cmd-results"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
<script>
const API_MOV  = 'http://localhost:8080/api/movimento';
const API_PROD = 'http://localhost:8080/api/produto';

let allMovimentos = [];
let allProdutos   = [];
let filtroAtivo   = 'todos';
let tipoSelecionado = 'Entrada';

// funções para formatar valores na tela
const fmtBRL = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtQtd = v => {
  const n = Number(v);
  return n % 1 === 0
    ? n.toLocaleString('pt-BR')
    : n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtData = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' +
    d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};

// busca os dados da API quando a página carrega
async function carregar() {
  document.getElementById('sf-skeleton').style.display = 'block';
  document.getElementById('sf-table-wrap').style.display = 'none';
  document.getElementById('sf-count').style.display = 'none';
  document.getElementById('sf-error').style.display = 'none';

  try {
    const [resMov, resProd] = await Promise.all([fetch(API_MOV), fetch(API_PROD)]);
    if (!resMov.ok)  throw new Error('HTTP ' + resMov.status);
    if (!resProd.ok) throw new Error('HTTP ' + resProd.status);

    allMovimentos = await resMov.json();
    allProdutos   = await resProd.json();

    document.getElementById('sf-skeleton').style.display = 'none';
    document.getElementById('sf-table-wrap').style.display = 'block';
    document.getElementById('sf-count').style.display = 'block';
    aplicar();
  } catch(e) {
    document.getElementById('sf-skeleton').style.display = 'none';
    document.getElementById('sf-error-msg').textContent = 'Não foi possível conectar à API: ' + e.message;
    document.getElementById('sf-error').style.display = 'flex';
  }
}

function aplicar() {
  const q = document.getElementById('sf-search').value.toLowerCase().trim();

  let lista = allMovimentos.filter(m => {
    if (filtroAtivo === 'Entrada') return m.tipo === 'Entrada';
    if (filtroAtivo === 'Saida')   return m.tipo === 'Saida';
    return true;
  });

  if (q) lista = lista.filter(m =>
    m.descricao.toLowerCase().includes(q) || m.codigo.toLowerCase().includes(q)
  );

  renderTabela(lista);
}

function renderTabela(lista) {
  const tbody = document.getElementById('sf-tbody');
  const count = document.getElementById('sf-count');

  if (!lista.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="7" style="text-align:center;padding:48px;color:var(--t3);font-size:13px">
          Nenhuma movimentação encontrada.
        </td>
      </tr>`;
    count.textContent = '';
    return;
  }

  tbody.innerHTML = lista.map(m => {
    const isEntrada = m.tipo === 'Entrada';
    const tag = isEntrada
      ? '<span class="sf-tag entrada"><i class="ti ti-arrow-bar-to-down" style="font-size:11px"></i> Entrada</span>'
      : '<span class="sf-tag saida"><i class="ti ti-arrow-bar-up" style="font-size:11px"></i> Saída</span>';
    const totalClass = isEntrada ? 'qty-ok' : 'qty-low';
    return `
      <tr>
        <td style="color:var(--t3);white-space:nowrap">${fmtData(m.data)}</td>
        <td class="col-center">${tag}</td>
        <td class="col-code">${m.codigo}</td>
        <td class="col-desc">${m.descricao}</td>
        <td class="col-num ${totalClass}">${fmtQtd(m.qtde)}</td>
        <td class="col-num" style="color:var(--t2)">${fmtBRL(m.precoUnit)}</td>
        <td class="col-num" style="color:var(--t1);font-weight:600">${fmtBRL(m.total)}</td>
      </tr>`;
  }).join('');

  count.textContent = lista.length + ' movimentação(ões) encontrada(s)';
}

// eventos dos botões de filtro e busca
document.getElementById('sf-refresh').addEventListener('click', carregar);
document.getElementById('sf-search').addEventListener('input', aplicar);

document.querySelectorAll('[data-f]').forEach(btn => {
  btn.addEventListener('click', function() {
    filtroAtivo = this.dataset.f;
    document.querySelectorAll('[data-f]').forEach(b =>
      b.classList.remove('active','amber-active','red-active'));
    this.classList.add('active');
    aplicar();
  });
});

carregar();

// mostra uma mensagem temporária no canto da tela
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `sf-toast ${type}`;
  el.innerHTML = `<i class="ti ti-${type === 'success' ? 'circle-check' : 'alert-circle'}"></i><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// controla a abertura e fechamento do modal
const modal = document.getElementById('sf-modal');

function popularSelect() {
  const sel = document.getElementById('f-produto');
  sel.innerHTML = '<option value="">Selecione um produto...</option>';
  allProdutos
    .filter(p => p.ativo)
    .sort((a, b) => a.descricao.localeCompare(b.descricao))
    .forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.descricao} (${p.codigo}) — estoque: ${Number(p.estoque)}`;
      opt.dataset.preco = p.preco;
      sel.appendChild(opt);
    });
}

function openModal() {
  popularSelect();
  document.getElementById('f-qtde').value  = '';
  document.getElementById('f-preco').value = '';
  tipoSelecionado = 'Entrada';
  document.querySelectorAll('.sf-tipo-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tipo === 'Entrada');
  });
  modal.classList.add('open');
  document.getElementById('f-produto').focus();
}
function closeModal() { modal.classList.remove('open'); }

// Preenche preço ao selecionar produto
document.getElementById('f-produto').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  document.getElementById('f-preco').value = opt.dataset.preco || '';
});

// Tipo toggle
document.querySelectorAll('.sf-tipo-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    tipoSelecionado = this.dataset.tipo;
    document.querySelectorAll('.sf-tipo-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
  });
});

document.getElementById('sf-btn-new').addEventListener('click', openModal);
document.getElementById('sf-modal-close').addEventListener('click', closeModal);
document.getElementById('sf-modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
});

document.getElementById('sf-modal-save').addEventListener('click', async () => {
  const produtoId = document.getElementById('f-produto').value;
  const qtde      = parseFloat(document.getElementById('f-qtde').value);
  const preco     = parseFloat(document.getElementById('f-preco').value) || 0;

  if (!produtoId)         { toast('Selecione um produto.', 'error'); return; }
  if (isNaN(qtde) || qtde <= 0) { toast('Informe uma quantidade válida.', 'error'); return; }

  const btn = document.getElementById('sf-modal-save');
  btn.disabled = true;
  btn.textContent = 'Registrando…';

  try {
    const res = await fetch(API_MOV, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ produtoId, tipo: tipoSelecionado, qtde, precoUnit: preco })
    });

    if (!res.ok) {
      const msg = await res.text();
      throw new Error(msg || 'HTTP ' + res.status);
    }

    closeModal();
    const label = tipoSelecionado === 'Entrada' ? 'Entrada' : 'Saída';
    toast(`${label} registrada com sucesso!`);
    await carregar();
  } catch (e) {
    toast('Erro: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-check" style="font-size:14px;margin-right:4px"></i>Registrar';
  }
});

// abre e fecha o menu lateral no celular
const sidebar  = document.getElementById('sf-sidebar');
const backdrop = document.getElementById('sf-backdrop');
function openSidebar()  { sidebar.classList.add('open');    backdrop.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }
document.getElementById('sf-menu-toggle').addEventListener('click', openSidebar);
document.getElementById('sf-close').addEventListener('click', closeSidebar);
backdrop.addEventListener('click', closeSidebar);

// paleta de busca rápida (abre com Ctrl+K)
const pages = [
  { name: 'Dashboard',       href: './index.html',         icon: 'ti-layout-dashboard' },
  { name: 'Estoque',         href: './produtos.html',       icon: 'ti-package' },
  { name: 'Movimentações',   href: './movimentacoes.html',  icon: 'ti-arrows-exchange' },
];

const cmdOverlay = document.getElementById('sf-cmd');
const cmdInput   = document.getElementById('sf-cmd-input');
const cmdResults = document.getElementById('sf-cmd-results');
let cmdFocusIdx  = -1;

function openCmd() {
  cmdOverlay.classList.add('open');
  cmdInput.value = '';
  cmdFocusIdx = -1;
  renderCmd('');
  setTimeout(() => cmdInput.focus(), 30);
}
function closeCmd() { cmdOverlay.classList.remove('open'); }

function renderCmd(q) {
  const s = q.toLowerCase().trim();
  let html = '';
  const pm = s ? pages.filter(p => p.name.toLowerCase().includes(s)) : pages;
  if (pm.length) {
    html += '<div class="sf-cmd-group">Páginas</div>';
    html += pm.map(p =>
      `<a href="${p.href}" class="sf-cmd-item"><i class="ti ${p.icon}"></i><span>${p.name}</span></a>`
    ).join('');
  }
  const prods = s
    ? allProdutos.filter(p => p.descricao.toLowerCase().includes(s) || p.codigo.toLowerCase().includes(s)).slice(0, 8)
    : allProdutos.slice(0, 5);
  if (prods.length) {
    html += '<div class="sf-cmd-group">Produtos</div>';
    html += prods.map(p =>
      `<a href="./produtos.html" class="sf-cmd-item">
         <i class="ti ti-package"></i>
         <span>${p.descricao}</span>
         <span class="meta">${p.codigo}</span>
       </a>`
    ).join('');
  }
  if (!html) html = '<div class="sf-cmd-empty">Nenhum resultado encontrado.</div>';
  cmdResults.innerHTML = html;
  cmdFocusIdx = -1;
}

function cmdNavigate(dir) {
  const items = cmdResults.querySelectorAll('.sf-cmd-item');
  if (!items.length) return;
  items[cmdFocusIdx]?.classList.remove('focused');
  cmdFocusIdx = (cmdFocusIdx + dir + items.length) % items.length;
  items[cmdFocusIdx].classList.add('focused');
  items[cmdFocusIdx].scrollIntoView({ block: 'nearest' });
}

cmdInput.addEventListener('input', () => renderCmd(cmdInput.value));
document.getElementById('sf-cmd-open').addEventListener('click', openCmd);
cmdOverlay.addEventListener('click', e => { if (e.target === cmdOverlay) closeCmd(); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openCmd(); return; }
  if (!cmdOverlay.classList.contains('open')) return;
  if (e.key === 'Escape')    { closeCmd(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdNavigate(1);  return; }
  if (e.key === 'ArrowUp')   { e.preventDefault(); cmdNavigate(-1); return; }
  if (e.key === 'Enter') {
    const focused = cmdResults.querySelector('.sf-cmd-item.focused');
    if (focused) focused.click();
  }
});
</script>
</body>
</html>
